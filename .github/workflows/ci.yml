name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Instalar, testar, verificar e buildar
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar código (typecheck)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Executar testes
        run: npm test

      - name: Build
        run: npm run build