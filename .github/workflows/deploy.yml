name: Deploy

# O deploy acontece automaticamente a cada atualização na branch main.
# As credenciais NUNCA ficam no código: use GitHub Secrets.

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    name: Buildar imagens Docker e publicar no GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem do backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:latest, ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build e push da imagem do frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:latest, ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Disparar deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}

    strategy:
      matrix:
        hook: [RENDER_BACKEND_HOOK, RENDER_FRONTEND_HOOK]

    steps:
      # Render: crie um Deploy Hook em cada serviço e guarde a URL em Secrets.
      - name: Chamar hook de deploy (Render)
        if: ${{ env.HOOK != '' }}
        env:
          HOOK: ${{ secrets[matrix.hook] }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST "$HOOK"
          fi

  # Exemplo alternativo para Railway:
  # - Railway: use a integração nativa do GitHub (Railway Build Packs)
  #   ou dispatche: curl -X POST https://backboard.railway.app/graphql/v2 ...
  # - VPS/VM própria: rode na VM `watchtower` + image ghcr.io/.../backend:latest,
  #   que atualiza o container automaticamente a cada push.